[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nhs-ae-analytics"
version = "0.1.0"
description = "NHS A&E performance, demand and capacity analytics portfolio project"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "SK Mizanur Rahman" }]
dependencies = [
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pandas-stubs",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]
analysis = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nhs_ae"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["nhs_ae"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
